<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManilaCTP</title>
    <link rel="stylesheet" href="style.css">
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- particle js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js" integrity="sha512-Kef5sc7gfTacR7TZKelcrRs15ipf7+t+n7Zh6mKNJbmW+/RRdCW9nwfLn4YX0s2nO6Kv5Y2ChqgIakaC6PW09A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

    <!-- manila ctp -->
    
    <!-- navigation -->
    <header id="navigation">
        <div class="header-navigation container">
            <div class="navigation-content">
                <img src="Assets/Images/CTP.png" alt="manila ctp logo" width="48" height="auto" class="nav-logo">

                <nav class="nav-link" id="link">
                    <ul>
                        <li><a href="#home" class="nLink">Home</a></li>
                        <li><a href="#about" class="nLink">About</a></li>
                        <li><a href="#services" class="nLink">Services</a></li>
                        <li><a href="#contact" class="nLink">Contact</a></li>
                    </ul>
                </nav>

                <i class="fa-solid fa-bars menu" id="menu"></i>
            </div>
        </div>
    </header>

    <!-- main -->
    <main class="main">
        <!-- home -->
        <section class="home-page" id="home">
            <div class="home-content container">
                <div class="home-grp">
                    <p class="home-tagline">Your CTP Partner, From Setup to Support</p>
                    <h1 class="home-heading">Reliable CTP Solutions, Right Here in Manila</h1>
                    <p class="home-subheading">ManilaCTP supplies and services Computer-to-Plate machines for commercial and newspaper printers nationwide.</p>
                    <div class="home-cta-grp">
                        <button class="home-cta btn">Contact <i class="fa-solid fa-arrow-right"></i></button>
                        <button class="home-cta btn">Message Us <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            </div>
        </section>
        <!-- about -->
        
    </main>

    <!-- javascript -->
    <script src="main.js"></script>
    
</body>
</html>
