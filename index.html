<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManilaCTP</title>
    <link rel="stylesheet" href="style.css">
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- manila ctp -->
    
    <!-- navigation -->
    <header class="navigation-ctp">
        <div class="navigation container" id="navigation-scroll">
            <div class="navigation-grp">
                <img src="Assets/Images/CTP.png" alt="ManilaCTP Logo" class="navigation-logo">

                <div class="navigation-actions">
                    <!-- navigation links -->
                    <nav class="navigation-links" id="nav-links">
                        <ul>
                            <li><a href="#home" class="nav-link">Home</a></li>
                            <li><a href="#about" class="nav-link">About</a></li>
                            <li><a href="#services" class="nav-link">Services</a></li>
                            <li><a href="#contact" class="nav-link">Contact</a></li>
                        </ul>
                    </nav>

                    <!-- navigation cta -->
                    <button class="navigation-cta btn">Message Us <i class="fa-solid fa-arrow-right"></i></button>

                    <!-- hamburger -->
                    <i class="fa-solid fa-bars hamburger" id="navigation-hamburger"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- main -->
    <main>
        <!-- home -->
        <section class="main-home" id="home">
            <div class="home-grp container">
                <div class="home-content">
                    <p class="home-tagline">Metro Manila · <span>CTP & Digital Printing</span></p>
                    <h1 class="home-heading">Reliable <span>CTP Solutions,</span> Right Here in <span>Manila</span></h1>
                    <p class="home-subheading">ManilaCTP supplies and services Computer-to-Plate machines for commercial and newspaper printers nationwide.</p>
                    <div class="home-cta-grp">
                        <button class="home-cta btn">View Services <i class="fa-solid fa-arrow-right"></i></button>
                        <button class="home-cta btn">Inquire Now <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- javascript -->
    <script src="main.js"></script>
    
</body>
</html>
